# XcodeGen config for Path1Bench (plan 8 v2 - iPhone benchmark app).
#
# Single iOS app target depending on mlx-swift + mlx-swift-examples via
# SwiftPM. Regenerate the .xcodeproj by running `xcodegen generate` in this
# directory; the committed .xcodeproj reflects the latest run.
#
# Plan section 6: pin tags via Package.resolved. We pin to `main` because
# Gemma-3/4 architecture support has been merged on `main` ahead of the
# most recent tagged release of mlx-swift-examples; revisit on the next
# tagged drop.
name: Path1Bench
options:
  bundleIdPrefix: com.path1bench
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    branch: main
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    branch: main

targets:
  Path1Bench:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Path1Bench
        excludes:
          - "Info.plist"
    info:
      path: Path1Bench/Info.plist
      properties:
        # Run-condition support per plan section "Run conditions".
        UIFileSharingEnabled: true            # Files.app browses Documents/
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresPersistentWiFi: false
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Path1Bench
        NSHumanReadableCopyright: "Path1Bench - plan 8 v2 on-device benchmark"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.path1bench.Path1Bench
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
