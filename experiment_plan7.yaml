# Copy to experiment.yaml (gitignored) and edit for your run.
# This config is for plan7: cross-benchmark validity on harder reasoning.
run:
  flags: "--script path1-plan7 --batch-size 8 --dtype fp16"
  result_dir: "results/path_1_cot_tokens/plan7"

pod:
  gpu_types: "NVIDIA GeForce RTX 4090"
  gpu_count: 1
  cloud_type: SECURE
  container_disk_gb: 20
  volume_gb: 30

git:
  url: "https://github.com/kasuncp/gemma4-retro-recurrence.git"
  ref: "path_1_plan_7"

budget:
  cap_usd: 2
  emergency_usd: 1.00
  max_hours: 10

watch:
  tick_seconds: 300