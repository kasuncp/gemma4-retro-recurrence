# Path 2 v2 — Phase 1: hook sanity gate.
#
# Sequentially runs six cells (~95 min on a 4090):
#   1A    baseline-C2            (200 GSM8K, IT) band [0.65, 0.82]
#                                                 N bumped from 50 to
#                                                 disambiguate trunc rate
#   1B-p1 baseline-8shot-control  (50 GSM8K, IT) smart_v2 in [0.20, 0.40]
#                                                 (Path 1 plan 5 anchor)
#   1B-r5 baseline-8shot-round5   (50 GSM8K, IT) legacy   in [0.44, 0.64]
#                                                 (round 5 bridge anchor)
#   1C    W5-r1                   (20 GSM8K, IT) token-match vs 1A
#   1D    W5-r8                   (10 GSM8K, IT) loop_rate < 0.95
#   1E    base ppl smoke   (Wikitext-2, base)    drift < 1e-4
#
# All gates must pass before Phase 2 launches. The runner exits
# non-zero on any failure and emits phase1_summary.json.
#
# Usage:
#   ./scripts/runpod.sh go experiment_path2_v2_phase1.yaml

run:
  flags: "--script path2-v2-phase1"
  result_dir: "results/path_2_depth_recurrence_v2/phase1"

pod:
  gpu_types: "NVIDIA GeForce RTX 4090"
  gpu_count: 1
  cloud_type: SECURE
  container_disk_gb: 30
  volume_gb: 50

git:
  url: "https://github.com/kasuncp/gemma4-retro-recurrence.git"
  ref: "path_2_phase_1"

budget:
  # Phase 1 is slow-to-fail: every cell has a numeric gate; any failure
  # halts the route. After the 1A bump to N=200 + the new 1B-r5 cell,
  # plan budget is ~$1.10-1.40 at 4090 spot. Cap leaves headroom for
  # the one-off model download on a fresh pod.
  cap_usd: 2.0
  emergency_usd: 0.40
  max_hours: 2.5

watch:
  # Tighter than usual --- Phase 1 is short, so a 5-min tick would
  # let it finish before the watcher even checks once.
  tick_seconds: 180
